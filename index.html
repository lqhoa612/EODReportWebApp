<!DOCTYPE html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<head>
    <meta charset="UTF-8">
    <title>Cash Till Counter</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container">
        <h1>Cash Till Counter</h1>

        <!-- DATE / TIME (auto, from device clock) -->
        <div class="datetime-row">
            <span id="dateDisplay">--/--/----</span>
            <span id="timeDisplay">--:--</span>
        </div>

        <h2>Cash in Till</h2>

        <div class="cash-row">
            <label>$50</label>
            <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="50">
            <span class="lineTotal">0.00</span>
        </div>

        <div class="cash-row">
            <label>$20</label>
            <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="20">
            <span class="lineTotal">0.00</span>
        </div>

        <div class="cash-row">
            <label>$10</label>
            <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="10">
            <span class="lineTotal">0.00</span>
        </div>

        <div class="cash-row">
            <label>$5</label>
            <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="5">
            <span class="lineTotal">0.00</span>
        </div>

        <div class="cash-row">
            <label>$2</label>
            <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="2">
            <span class="lineTotal">0.00</span>
        </div>

        <div class="cash-row">
            <label>$1</label>
            <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="1">
            <span class="lineTotal">0.00</span>
        </div>

        <div class="cash-row">
            <label>50c</label>
            <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="0.50">
            <span class="lineTotal">0.00</span>
        </div>

        <div class="cash-row">
            <label>20c</label>
            <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="0.20">
            <span class="lineTotal">0.00</span>
        </div>

        <div class="cash-row">
            <label>10c</label>
            <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="0.10">
            <span class="lineTotal">0.00</span>
        </div>

        <div class="cash-row">
            <label>5c</label>
            <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="0.05">
            <span class="lineTotal">0.00</span>
        </div>

        <div class="total sticky-total">
            <span>Total Cash</span>
            <span id="cashTotal">0.00</span>
        </div>

        <h2>Card Reconciliation</h2>

        <div class="card-row">
            <label>EFTPOS card</label>
            <input type="number" inputmode="decimal" step="0.01" min="0" class="cardAmount" id="eftpos">
        </div>

        <div class="card-row">
            <label>Kiosk</label>
            <input type="number" inputmode="decimal" step="0.01" min="0" class="cardAmount" id="kiosk">
        </div>

        <div class="card-row">
            <label>Card at shop</label>
            <input type="number" inputmode="decimal" step="0.01" min="0" class="cardAmount" id="cardAtShop">
        </div>

    </div>
    <div class="button-row">
        <button id="shareBtn" class="share-btn">Share Count</button>
        <button id="clearBtn">Clear All</button>
    </div>
    <script src="js/app.js"></script>
</body>

</html>
