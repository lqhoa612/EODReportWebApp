<!DOCTYPE html>
<html lang="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<head>
    <meta charset="UTF-8">
    <title>Cash Till Counter</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="container">
        <h1>Cash Till Counter</h1>

        <!-- DATE -->
        <label>Count Date:</label>
        <input type="date" inputmode="decimal" pattern="[0-9]*" id="date">

        <h2>Notes</h2>

        <div id="notesGroup">
            <div class="cash-row">
                <label>$100</label>
                <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="100">
                <span class="lineTotal">0.00</span>
            </div>

            <div class="cash-row">
                <label>$50</label>
                <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="50">
                <span class="lineTotal">0.00</span>
            </div>

            <div class="cash-row">
                <label>$20</label>
                <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="20">
                <span class="lineTotal">0.00</span>
            </div>

            <div class="cash-row">
                <label>$10</label>
                <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="10">
                <span class="lineTotal">0.00</span>
            </div>

            <div class="cash-row">
                <label>$5</label>
                <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="5">
                <span class="lineTotal">0.00</span>
            </div>
        </div>

        <div class="total">
            <span>Notes Subtotal</span>
            <span id="notesTotal">0.00</span>
        </div>

        <hr>

        <h2>Coins</h2>

        <div id="coinsGroup">
            <div class="cash-row">
                <label>$2</label>
                <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="2">
                <span class="lineTotal">0.00</span>
            </div>

            <div class="cash-row">
                <label>$1</label>
                <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="1">
                <span class="lineTotal">0.00</span>
            </div>

            <div class="cash-row">
                <label>50c</label>
                <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="0.5">
                <span class="lineTotal">0.00</span>
            </div>

            <div class="cash-row">
                <label>20c</label>
                <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="0.2">
                <span class="lineTotal">0.00</span>
            </div>

            <div class="cash-row">
                <label>10c</label>
                <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="0.1">
                <span class="lineTotal">0.00</span>
            </div>

            <div class="cash-row">
                <label>5c</label>
                <input type="number" inputmode="decimal" pattern="[0-9]*" class="cashCount" data-value="0.05">
                <span class="lineTotal">0.00</span>
            </div>
        </div>

        <div class="total">
            <span>Coins Subtotal</span>
            <span id="coinsTotal">0.00</span>
        </div>

        <div class="total sticky-total">
            <span>Total Cash</span>
            <span id="cashTotal">0.00</span>
        </div>

    </div>
    <button id="clearBtn">Clear All</button>
    <script src="js/app.js"></script>
</body>

</html>
